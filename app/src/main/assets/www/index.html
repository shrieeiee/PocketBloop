<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e4f3ef">
<title>Pocket Bloop</title>
<style>
@font-face{font-family:"Mochiy Pop One";font-weight:400;font-display:swap;src:url(fonts/mochiy-pop-one-400.woff2) format("woff2")}
@font-face{font-family:"M PLUS Rounded 1c";font-weight:400;font-display:swap;src:url(fonts/mplus-rounded-400.woff2) format("woff2")}
@font-face{font-family:"M PLUS Rounded 1c";font-weight:700;font-display:swap;src:url(fonts/mplus-rounded-700.woff2) format("woff2")}
@font-face{font-family:"M PLUS Rounded 1c";font-weight:800;font-display:swap;src:url(fonts/mplus-rounded-800.woff2) format("woff2")}
@font-face{font-family:"DM Mono";font-weight:400;font-display:swap;src:url(fonts/dm-mono-400.woff2) format("woff2")}
@font-face{font-family:"DM Mono";font-weight:500;font-display:swap;src:url(fonts/dm-mono-500.woff2) format("woff2")}

/* Colours are plain hex (no color-mix) so older Android WebViews render them. Style-tinted colours are computed in JS. */
:root{
  --bg:#e4f3ef; --shell:#ffe4ef; --panel:#fffafd; --ink:#3b2b4f; --muted:#7a6790;
  --line:#3b2b4f; --shadowc:#3b2b4f; --pop:#ffcf4d; --on-pop:#3b2b4f;
  --cell:#f1e3f5; --cell2:#e7d4ee; --screen:#f3fbff; --cell-line:rgba(59,43,79,.4); --led-beat:#c9b6d8;
  --c-k:#ff7aa8; --c-s:#ffa94d; --c-h:#4fbfd8; --c-p:#9c8af0; --c-b:#46b98a;
  --style:#6fd0dc; --style-soft:#c7eaf0; --style-pad:#b9e9ef; --dot:rgba(111,208,220,.35);
  --f-display:"Mochiy Pop One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Nunito",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#191326; --shell:#2b2141; --panel:#231b36; --ink:#f6ecff; --muted:#b4a3cc;
  --line:#6a579e; --shadowc:#0b0714; --cell:#33284c; --cell2:#3d3159; --screen:#1e172f; --cell-line:rgba(106,87,158,.55); --led-beat:#56467a;
  color-scheme:dark }}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);background-size:22px 22px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0;margin:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--style);outline-offset:2px}
svg{display:block}

.app{height:100%;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))}

/* chunky sticker look, shared */
.stk{border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadowc)}
.press{transition:transform .07s}
.press:active,.press.down{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadowc)}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex:none}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;line-height:1;text-shadow:2px 2px 0 var(--style);white-space:nowrap}
.brand h1 small{font-size:inherit}
@media (max-width:400px){.brand h1{font-size:19px}}
.brand p{margin:3px 0 0;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tempo{display:flex;align-items:stretch;border-radius:16px;background:var(--panel);overflow:hidden;height:48px;flex:none}
.tempo button{width:38px;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tempo button:active{background:var(--cell)}
.tempo .read{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:46px;border-left:2px solid var(--cell2);border-right:2px solid var(--cell2);font-family:var(--f-mono);line-height:1}
.tempo b{font-size:18px;font-variant-numeric:tabular-nums;font-weight:500}
.tempo span{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.playbtn{width:56px;height:56px;flex:none;border-radius:50%;background:var(--pop);color:var(--on-pop);display:flex;align-items:center;justify-content:center}
.playbtn svg{width:24px;height:24px}

/* the mascot screen */
.stage{position:relative;overflow:hidden;flex:none;height:21vh;min-height:104px;max-height:170px;display:flex;align-items:center;gap:8px;
  padding:6px 12px 8px 4px;border-radius:22px;background:var(--style-soft)}
#blob{height:100%;width:auto;max-width:42%;flex:none;transform-origin:50% 95%;position:relative;z-index:1}
#blob.bump{animation:bump .2s ease-out}
@keyframes bump{0%{transform:scale(1.09,.9)}60%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}}
#blob .eyes{animation:blink 4.2s infinite;transform-origin:100px 104px;transition:transform .12s}
#blob.singing .eyes{animation:none;transform:translateY(var(--lift,0px)) scaleY(.75)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#blob.frog .eyes{display:none}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.tag span{overflow:hidden;text-overflow:ellipsis}
.stylename{font-family:var(--f-display);font-size:21px;line-height:1.08;display:flex;align-items:center;gap:6px}
.stylename svg{width:18px;height:18px;flex:none;opacity:.7}
.info{cursor:pointer}
.sheet{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;background:rgba(25,19,38,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-width:560px;max-height:80%;overflow-y:auto;touch-action:pan-y;background:var(--shell);border-radius:24px;padding:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-card h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 10px}
.sheet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sheet-grid .chip{width:100%;height:46px}
.blurb{margin:0;font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.leds{display:flex;gap:3px;margin-top:4px}
.leds span{flex:1;height:8px;border-radius:4px;background:var(--cell2);border:1.5px solid var(--line)}
.leds span:nth-child(4n+1){background:var(--led-beat)}
.leds span.on{background:var(--pop)}
.fx{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:2}
.fx span{position:absolute;font-size:17px;color:var(--ink);animation:rise 1.1s ease-out forwards;opacity:.9;will-change:transform}
.fx span.bub{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,255,255,.55)}
@keyframes rise{to{transform:translate(var(--dx),-100px) scale(1.3);opacity:0}}
.idle-bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(59,43,79,.4);animation:float 6s linear infinite;z-index:0;will-change:transform}
@keyframes float{to{transform:translateY(-260px);opacity:0}}

/* style cartridges: a horizontal swipe strip */
.styles{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;flex:none;padding:2px 3px 6px 2px;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.styles::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:42px;padding:0 15px 0 9px;border-radius:999px;background:var(--panel);font-weight:800;font-size:14px;white-space:nowrap;box-shadow:2px 2px 0 var(--shadowc)}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid var(--line);flex:none}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on-pop)}
.chip[aria-pressed="true"] i{background:#fff}

/* tabs */
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--panel);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:2px 2px 0 var(--shadowc)}
.tab svg{width:17px;height:17px;flex:none}
.tab[aria-selected="true"]{background:var(--style);color:var(--on-pop)}
@media (max-width:370px){.tab svg{display:none}.tab{font-size:13px}}

/* main area */
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.view[hidden]{display:none}
.lh{display:flex;align-items:center;gap:6px;flex:none;min-height:40px}
.lh h2{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 auto 0 2px;white-space:nowrap}
.seg{display:flex;border:2.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);flex:none}
.seg[hidden]{display:none}
.seg button{height:38px;padding:0 11px;font-family:var(--f-mono);font-size:12.5px;font-weight:500;position:relative}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button.live::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--pop);border:1.5px solid var(--line)}
.icon{width:42px;height:38px;border-radius:12px;border:2.5px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.icon svg{width:21px;height:21px}
.icon[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* step grids fill whatever height is left */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:var(--lw) repeat(var(--n),minmax(0,1fr));grid-template-rows:13px;grid-auto-rows:minmax(0,1fr);
  gap:4px;position:relative;touch-action:none;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:5px 5px 6px;box-shadow:3px 3px 0 var(--shadowc)}
.num{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;line-height:13px;overflow:hidden}
.num.beat{color:var(--ink);font-weight:500}
.cell{border-radius:8px;border:2px solid var(--cell-line);background:var(--cell);min-height:0;min-width:0}
.cell.alt{background:var(--cell2)}
.cell.on{background:var(--trk);border-color:var(--line);box-shadow:inset 0 -3px 0 rgba(59,43,79,.28)}
.x{display:none!important}
.ph{position:absolute;top:0;left:0;right:0;bottom:0;margin:-3px;border-radius:10px;border:3px solid var(--pop);pointer-events:none;visibility:hidden;z-index:2}
.rl{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0}
.rname{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:9px;border:2.5px solid var(--line);background:var(--trk);color:var(--on-pop);font-weight:800;font-size:11.5px;line-height:1.1;padding:0 2px;overflow:hidden;word-break:break-word}
.rname.muted{background:var(--cell2);color:var(--muted);text-decoration:line-through}
.rdice{display:none;flex:none;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--panel);align-items:center;justify-content:center}
.rdice svg{width:16px;height:16px}
.nl{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:2px;min-height:0;overflow:hidden;border-radius:6px}
.nl:active{background:var(--cell)}
.lane-muted .cell,.row-muted{opacity:.4}
@media (min-height:780px){.rl{gap:5px}.rdice{display:flex;height:28px}}

/* jam pads */
.pads{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;touch-action:none;padding:0 3px 3px 0}
.pad{border-radius:20px;background:var(--style-pad);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0;transition:transform .06s}
.pad b{font-family:var(--f-mono);font-size:19px;font-weight:500}
.pad small{font-size:11px;color:var(--muted);font-weight:800}
.pad.hit{transform:translate(2px,2px) scale(.96);box-shadow:1px 1px 0 var(--shadowc);background:var(--style)}
.jamhint{margin:0;font-size:12.5px;color:var(--muted);font-weight:700;text-align:center;flex:none}

/* knobs */
.scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:2px 4px 10px 2px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:18px;padding:12px}
.card h3{font-family:var(--f-display);font-weight:400;font-size:15px;margin:0 0 8px}
.selects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.selects label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:12px}
select{width:100%;height:42px;padding:0 8px;border-radius:12px;border:2.5px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;min-width:0}
.knobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
@media (min-width:640px){.knobs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.knob label{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:13px}
.knob output{font-family:var(--f-mono);font-weight:400;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;background:transparent;margin:0;--v:50%;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:99px;border:2px solid var(--line);background:linear-gradient(to right,var(--style) var(--v),var(--cell2) var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--pop);border:3px solid var(--line);margin-top:-9px}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;border:2px solid var(--line);background:linear-gradient(to right,var(--style) var(--v),var(--cell2) var(--v))}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--pop);border:3px solid var(--line)}
.tog{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;text-align:left}
.tog+.tog{border-top:2px dashed var(--cell2)}
.tog span{flex:1;min-width:0}
.tog b{display:block;font-weight:800;font-size:14px}
.tog small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.sw{width:50px;height:30px;border-radius:99px;border:2.5px solid var(--line);background:var(--cell2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;border:2.5px solid var(--line);transition:transform .15s}
.tog[aria-checked="true"] .sw{background:var(--style)}
.tog[aria-checked="true"] .sw::after{transform:translateX(20px)}

/* dice bar */
.dice{display:flex;gap:6px;flex:none}
.db{flex:1;min-width:0;height:54px;border-radius:15px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:11px;line-height:1.05;text-align:center}
.db svg{width:21px;height:21px;flex:none}
.db.big{flex:1.6;background:var(--pop);color:var(--on-pop);font-size:13.5px}
.db.rolled svg{animation:spin .45s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;transition:opacity .18s,transform .18s;
  background:var(--ink);color:var(--panel);border-radius:999px;padding:5px 5px 5px 16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:13.5px;z-index:9;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--pop);color:var(--on-pop);border-radius:999px;height:36px;padding:0 16px;font-weight:800}

/* short phones */
@media (max-height:640px){.blurb{display:none}.brand p{display:none}.stage{height:19vh}}
/* short portrait phones: drop the swipe strip (style picker opens from the mascot screen) to give the grid room */
@media (orientation:portrait) and (max-height:720px){.styles{display:none}.stage{min-height:92px}}
@media (max-height:560px){.db{height:48px}.tab{height:40px}.chip{height:38px}}

/* wide: landscape phones, tablets — mascot column on the left, editor on the right */
@media (orientation:landscape) and (min-width:560px), (min-width:820px){
  .app{display:grid;grid-template-columns:minmax(220px,31%) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"top tabs" "stage main" "styles main" "dice main";column-gap:12px;row-gap:8px}
  .top{grid-area:top}.tabs{grid-area:tabs;align-self:center}.styles{grid-area:styles}.dice{grid-area:dice}.main{grid-area:main}
  .stage{grid-area:stage;height:auto;max-height:none;min-height:0;flex-direction:column;justify-content:center;padding:8px 10px}
  #blob{flex:1 1 0;min-height:0;height:auto;width:100%;max-width:none;max-height:190px}
  .info{flex:none;align-items:center;text-align:center;width:100%}
  .tag{width:100%}
  .blurb{display:-webkit-box}
  .toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (orientation:landscape) and (max-height:500px){
  .blurb,.brand p,.tag{display:none!important}
  .brand h1{font-size:19px}
  .db{height:46px}.db span{display:none}.db.big span{display:inline}
  .tab{height:40px}.chip{height:36px}.tempo{height:44px}.playbtn{width:50px;height:50px}
  .stylename{font-size:17px}
}
@media (orientation:landscape) and (max-width:1000px){.brand{display:none}.top{justify-content:flex-end}}
@media (orientation:landscape) and (max-width:760px){.db.big span{display:none}}

@media (prefers-reduced-motion:reduce){
  #blob.bump,#blob .eyes,.fx span,.idle-bub,.db.rolled svg{animation:none!important}
  .idle-bub{display:none}
}
.lite .idle-bub{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>Pocket Bloop</h1>
      <p>a little synth for every kind of -core</p>
    </div>
    <div class="tempo stk">
      <button id="bpmDown" aria-label="Slower">−</button>
      <div class="read"><b id="bpmBig">92</b><span>bpm</span></div>
      <button id="bpmUp" aria-label="Faster">+</button>
    </div>
    <button class="playbtn stk press" id="play" aria-label="Play">
      <svg viewBox="0 0 24 24" id="playIcon"></svg>
    </button>
  </header>

  <section class="stage stk" id="stage">
    <svg id="blob" viewBox="0 0 200 170" aria-label="Bloop, tap to sing">
      <g id="accBack"></g>
      <path d="M100 52 C150 52 172 88 170 120 C168 152 140 164 100 164 C60 164 32 152 30 120 C28 88 50 52 100 52Z" fill="var(--style)" stroke="#3b2b4f" stroke-width="4"/>
      <ellipse cx="68" cy="84" rx="13" ry="7" fill="#fff" opacity=".55" transform="rotate(-28 68 84)"/>
      <g class="eyes">
        <ellipse cx="78" cy="106" rx="7.5" ry="9.5" fill="#3b2b4f"/><circle cx="80.5" cy="102" r="2.8" fill="#fff"/>
        <ellipse cx="122" cy="106" rx="7.5" ry="9.5" fill="#3b2b4f"/><circle cx="124.5" cy="102" r="2.8" fill="#fff"/>
      </g>
      <ellipse cx="60" cy="125" rx="10" ry="5.5" fill="#ff6f9f" opacity=".5"/>
      <ellipse cx="140" cy="125" rx="10" ry="5.5" fill="#ff6f9f" opacity=".5"/>
      <path id="mouth" d="M91 122 Q100 131 109 122" fill="none" stroke="#3b2b4f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse id="tongue" cx="100" cy="128" rx="5" ry="3" fill="#ff8fb3" style="opacity:0"/>
      <g id="accFront"></g>
    </svg>
    <div class="info">

function isOn(t,r,s){return t==='mel'||t==='bass'?!!(S[t][s]>>r&1):!!S[t][s]}

  if(t==='mel'){lead(at,degMidi(r,leadRoot()),.3);react({ds:bits(S.mel[s]),len:.3,up:0})}

}

  const s=sOf(el._c);if(isOn(el._t,el._r,s)===val)return;setOn(el._t,el._r,s,val);

}

    const val=!isOn(el._t,el._r,sOf(el._c));drags.set(e.pointerId,{val,last:el});touchCell(lane,el,val);
    try{g.setPointerCapture(e.pointerId)}catch(_){}
  });

    const d=drags.get(e.pointerId);if(!d)return;
    const hit=document.elementFromPoint(e.clientX,e.clientY);const el=hit&&hit.closest&&hit.closest('.cell');
    if(!el||el===d.last||el.parentNode!==g)return;d.last=el;holdFollowUntil=Date.now()+3000;touchCell(lane,el,d.val);

  s.style.left=rnd(10,85)+'%';s.style.bottom=(22+hi*3)+'%';s.style.setProperty('--dx',rnd(-26,26)+'px');s.addEventListener('animationend',()=>s.remove());fx.appendChild(s)}
function setIdleBubbles(on){const sc=$('stage');sc.querySelectorAll('.idle-bub').forEach(e=>e.remove());if(!on||reduce||LITE)return;
  for(let i=0;i<6;i++){const b=mk('span','idle-bub');b.style.left=rnd(5,95)+'%';b.style.animationDelay=(-rnd(0,6))+'s';b.style.animationDuration=rnd(5,9)+'s';const z=rnd(6,13);b.style.width=b.style.height=z+'px';sc.appendChild(b)}}
$('blob').addEventListener('pointerdown',e=>{e.preventDefault();padHit(ri(0,7))});

// ---------- visual clock: only runs while there is something to draw ----------
let rafOn=false;
function wake(){if(!rafOn){rafOn=true;requestAnimationFrame(loop)}}
function loop(){
  if(ctx){while(queue.length&&queue[0].t<=ctx.currentTime){const e=queue.shift();if(!playing)continue;setHead(e.i);if(e.kicked)react(false);if(e.noted)sing(e.noted)}}
  if(playing||queue.length)requestAnimationFrame(loop);else rafOn=false;
}

// ---------- dice bar ----------
function flash(btn){btn.classList.remove('rolled');void btn.offsetWidth;btn.classList.add('rolled')}
$('play').onclick=()=>{playing?stop():start();buzz(10)};
tempoBtn($('bpmDown'),-1);tempoBtn($('bpmUp'),1);
$('rollAll').onclick=e=>{withUndo('Rolled a new pattern',()=>{rollAll();S.key=ri(0,11);S.scale=pick(cur.scales);S.bpm=ri(cur.bpm[0],cur.bpm[1]);relabel();refreshAll();syncAll();setParams();save()});flash(e.currentTarget);buzz(14);react(true)};
$('mutate').onclick=e=>{withUndo('Wiggled',()=>{mutate();refreshAll();save()});flash(e.currentTarget);buzz(10)};
$('diceSound').onclick=e=>{withUndo('New sound',()=>{diceSound();syncAll();setParams();save()});flash(e.currentTarget);buzz(10)};
$('surprise').onclick=e=>{withUndo('Surprise!',()=>applyStyle(pick(STYLES.filter(s=>s.id!==cur.id)).id));flash(e.currentTarget);buzz(14)};
$('clear').onclick=()=>{withUndo('Cleared',()=>{['k','s','h','p'].forEach(id=>S[id]=blank());S.mel=blankN();S.bass=blankN();refreshAll();save()});buzz(18)};

// hardware keyboard still works (Chromebooks, tablets with keyboards)
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;const tg=e.target.tagName;if(tg==='SELECT'||tg==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();playing?stop():start();return}
  const pi='asdfghjk'.indexOf(k);if(pi>=0&&k.length===1){padHit(pi);return}
  if(k==='r')$('rollAll').click();if(k==='w')$('mutate').click();
});

// pause when the app goes to the background — saves battery and avoids a stuck loop
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(playing)stop();if(ctx&&ctx.state==='running')ctx.suspend()}});
window.bloopBack=()=>{if(!$('sheet').hidden){closeSheet();return true}if(tab!=='beat'){showTab('beat');return true}return false};

// ---------- boot ----------
document.body.classList.toggle('lite',LITE);
for(let i=0;i<16;i++){const l=mk('span');$('leds').appendChild(l);ledEls.push(l)}
buildTabs();buildStyles();buildKnobs();buildPads();['beat','tune','bass'].forEach(buildLane);
const st=saved&&saved.S;
if(st&&SBY[st.style]&&Array.isArray(st.k)&&st.k.length===16){
  const m=Object.assign({k:0,s:0,h:0,p:0,mel:0,bass:0},st.mute||{});applyStyle(st.style,'restore',Object.assign({},st,{mute:m}));
}else applyStyle('sea','first');
showTab(saved&&saved.tab&&$('v-'+saved.tab)?saved.tab:'beat');
setPlayIcon();fit();
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe($('main'));else window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
