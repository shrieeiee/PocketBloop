plugins { id 'com.android.application' }

android {
    namespace 'com.pocketbloop.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pocketbloop.app'
        minSdk 24          // Android 7.0+, covers practically every budget phone still in use
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the release APK installs straight away.
            // Swap in your own keystore before publishing to the Play Store.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['woff2'] }
}
// No dependencies: a plain WebView shell keeps the APK tiny and fast to start.
